<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Encargados · LQA Valle Grande</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, rgba(254, 240, 138, 0.35) 0%, rgba(22, 101, 52, 0.48) 100%),
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            padding: 1rem;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 390px;
            border-radius: 18px;
            padding: 2.2rem 2rem 1.8rem;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
            text-align: center;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 1.35rem;
            font-weight: 700;
            color: #065f46;
            margin-bottom: 0.25rem;
        }

        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0284c7;
            margin-bottom: 1.35rem;
        }

        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 999px;
            padding: 0.65rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-google:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #94a3b8;
            font-size: 0.78rem;
            margin: 1rem 0;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .divider span { padding: 0 0.75rem; }

        .form-group {
            text-align: left;
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.35rem;
        }

        .input-wrapper { position: relative; }

        .form-group input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 1px solid #e2e8f0;
            background: #eef2ff;
            border-radius: 10px;
            font-size: 0.88rem;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .form-group input:focus {
            background: #ffffff;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
        }

        .toggle-pass {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 1rem;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.78rem;
            color: #0284c7;
            text-decoration: none;
            margin-top: -0.4rem;
            margin-bottom: 1.3rem;
        }
        .forgot-link:hover { text-decoration: underline; }

        .actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }

        .register-link {
            font-size: 0.85rem;
            color: #0284c7;
            text-decoration: underline;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-submit {
            flex: 1;
            max-width: 165px;
            padding: 0.68rem 1.2rem;
            border: none;
            border-radius: 999px;
            background: #059669;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-submit:not(:disabled):hover {
            background: #047857;
        }

        .error-msg {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            font-size: 0.8rem;
            padding: 0.55rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .card-footer {
            border-top: 1px solid #f1f5f9;
            padding-top: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.76rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">🧪 LQA · Valle Grande</div>
        <h1>¡Bienvenido!</h1>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="modo_google" value="1">
            <button type="submit" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continuar con Google (@vallegrande)
            </button>
        </form>

        <div class="divider"><span>o con credenciales LQA</span></div>

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">Email Institucional</label>
                <input type="email" id="email" name="email" placeholder="encargado@vallegrande.edu.pe" value="jean.chulluncuy@vallegrande.edu.pe" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Ingresar contraseña" required>
                    <button type="button" class="toggle-pass" onclick="verPass()">👁️</button>
                </div>
            </div>

            <a href="#" class="forgot-link" onclick="alert('Contacte al administrador del LQA (Equipo T07) para restablecer su clave.'); return false;">¿Olvidaste tu contraseña?</a>

            <div class="actions-row">
                <span class="register-link" onclick="alert('Solo el personal autorizado del Laboratorio de Química Agrícola puede solicitar alta.');">Solicitar acceso</span>
                <button type="submit" class="btn-submit" id="btnIngresar" disabled>Ingresar</button>
            </div>
        </form>

        <div class="card-footer">
            <span>Español (América Latina) ▾</span>
            <span>Equipo T07 · LQA</span>
        </div>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const btnIngresar = document.getElementById('btnIngresar');

        function validarCampos() {
            btnIngresar.disabled = !(emailInput.value.trim() && passInput.value.trim());
        }

        emailInput.addEventListener('input', validarCampos);
        passInput.addEventListener('input', validarCampos);

        function verPass() {
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
